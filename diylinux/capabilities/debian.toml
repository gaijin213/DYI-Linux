[meta]
name = "Debian"
family = "debian"
release = "trixie"
rolling = false
secure_boot = true
arches = ["x86_64", "aarch64"]
blurb = "Stable point releases, huge package archive, conservative versions. Secure Boot works out of the box."
default_mirror = "http://deb.debian.org/debian"
components = ["main", "contrib", "non-free", "non-free-firmware"]

[disk]
filesystems = ["ext4", "btrfs", "xfs"]

[base]
packages = ["linux-image-{debarch}", "firmware-linux", "sudo", "locales", "console-setup", "keyboard-configuration", "intel-microcode", "amd64-microcode", "btrfs-progs", "xfsprogs", "dosfstools", "cryptsetup", "cryptsetup-initramfs", "lvm2", "bash-completion", "nano", "ca-certificates", "curl", "systemd-timesyncd", "systemd-resolved"]
services = ["systemd-timesyncd"]

[bootloader.grub]
label = "GRUB (Secure Boot signed)"
packages = ["grub-efi-{debarch}", "grub-efi-{debarch}-signed", "shim-signed", "efibootmgr"]

[desktop.gnome]
label = "GNOME"
packages = ["gnome-core", "gnome-tweaks", "gdm3"]
dm = "gdm3"
[desktop.kde]
label = "KDE Plasma"
packages = ["kde-plasma-desktop", "sddm", "konsole", "dolphin", "kate"]
dm = "sddm"
[desktop.xfce]
label = "Xfce"
packages = ["xfce4", "xfce4-goodies", "lightdm", "lightdm-gtk-greeter"]
dm = "lightdm"
[desktop.cinnamon]
label = "Cinnamon"
packages = ["cinnamon-desktop-environment", "lightdm", "lightdm-gtk-greeter"]
dm = "lightdm"
[desktop.sway]
label = "Sway (Wayland tiling WM, start with `sway` from the console)"
packages = ["sway", "swaybg", "foot", "wmenu", "polkitd"]
[desktop.hyprland]
label = "Hyprland (Wayland, start with `Hyprland` from the console)"
packages = ["hyprland", "kitty", "wofi", "polkitd", "xdg-desktop-portal-hyprland"]
[desktop.i3]
label = "i3 (X11 tiling WM)"
packages = ["i3", "i3status", "suckless-tools", "xserver-xorg", "xinit", "xterm", "lightdm", "lightdm-gtk-greeter"]
dm = "lightdm"
[desktop.none]
label = "None (console only)"
packages = []

[graphics.mesa]
label = "Mesa (Intel, AMD, Nouveau for NVIDIA) - open source, default"
packages = ["mesa-vulkan-drivers", "libgl1-mesa-dri", "libglx-mesa0", "mesa-va-drivers", "mesa-utils"]
[graphics.nvidia]
label = "NVIDIA proprietary (nvidia-driver from non-free, DKMS)"
packages = ["nvidia-driver", "firmware-misc-nonfree", "linux-headers-{debarch}"]

[power.ppd]
label = "power-profiles-daemon (integrates with GNOME/KDE)"
packages = ["power-profiles-daemon"]
services = ["power-profiles-daemon"]
[power.tlp]
label = "TLP (laptop battery tuning)"
packages = ["tlp"]
services = ["tlp"]
[power.none]
label = "None"
packages = []

[firewall.none]
label = "None"
packages = []
[firewall.ufw]
label = "ufw"
packages = ["ufw"]
services = ["ufw"]
ufw_enable = true
[firewall.firewalld]
label = "firewalld"
packages = ["firewalld"]
services = ["firewalld"]
[firewall.nftables]
label = "nftables (plain ruleset)"
packages = ["nftables"]
services = ["nftables"]

[audio.pipewire]
label = "PipeWire (default)"
packages = ["pipewire-audio", "pipewire-alsa"]
[audio.pulseaudio]
label = "PulseAudio (legacy)"
packages = ["pulseaudio", "pavucontrol"]
[audio.none]
label = "None"
packages = []

[network.networkmanager]
label = "NetworkManager (default)"
packages = ["network-manager"]
services = ["NetworkManager"]
[network.networkd]
label = "systemd-networkd + iwd (minimal)"
packages = ["iwd"]
services = ["systemd-networkd", "systemd-resolved", "iwd"]
networkd_dhcp = true
