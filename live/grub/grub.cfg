source /boot/grub/config.cfg

# Live boot
menuentry "DIY Linux (amd64)" --hotkey=l {
	linux	/live/vmlinuz-6.12.113+deb13-amd64 boot=live components quiet systemd.show_status=false findiso=${iso_path}
	initrd	/live/initrd.img-6.12.113+deb13-amd64
}
menuentry "DIY Linux (amd64 fail-safe mode)" {
	linux	/live/vmlinuz-6.12.113+deb13-amd64 boot=live components memtest noapic noapm nodma nomce nosmp nosplash vga=788
	initrd	/live/initrd.img-6.12.113+deb13-amd64
}

submenu 'Utilities...' --hotkey=u {
	source /boot/grub/theme.cfg

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	menuentry "Verify integrity of the boot medium" --hotkey=v {
		linux	/live/vmlinuz-6.12.113+deb13-amd64 boot=live components systemd.show_status=false findiso=${iso_path} verify-checksums
		initrd	/live/initrd.img-6.12.113+deb13-amd64
	}
}
